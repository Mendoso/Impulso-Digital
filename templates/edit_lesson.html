{% extends 'base.html' %}{% block content %}<section class="section narrow"><p class="eyebrow">GESTÃO DE CONTEÚDOS</p><h1 class="page-title">Editar aula</h1><form class="form-card" method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><label>Módulo<input name="module" value="{{ lesson.module }}" required></label><label>Título<input name="title" value="{{ lesson.title }}" required></label><label>Ordem<input name="position" type="number" min="1" value="{{ lesson.position }}" required></label><label>Conteúdo de leitura<textarea name="content" rows="12" required>{{ lesson.content }}</textarea></label><label>Vídeo incorporável YouTube/Vimeo<input name="video_url" type="url" value="{{ lesson.video_url }}"></label><label>Material PDF / recurso HTTPS<input name="material_url" type="url" value="{{ lesson.material_url }}"></label><button class="button full">Guardar alterações</button></form><a class="text-link" href="{{ url_for('admin') }}">← Administração</a></section>{% endblock %}
